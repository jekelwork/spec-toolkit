# Source-only: tests the toolkit export. It is excluded from the export and never published.
name: Toolkit source

on:
  pull_request:

permissions:
  contents: read

jobs:
  toolkit-export:
    name: Toolkit export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the manifest classifies every tracked file
        run: python3 scripts/export_toolkit.py --check
