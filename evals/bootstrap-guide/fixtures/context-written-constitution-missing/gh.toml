# project-context.toml is written locally but nothing is on main yet and no constitution exists:
# the engine reads no remote file (every contents call is a 404, matched by a glob because the path
# varies), one bootstrap issue is open and its branch is on origin (see git.toml), and the board,
# labels and ruleset are not set up. Neutral placeholder names only: repository o/r (the harness
# origin), login octocat.

[[call]]
argv = ["auth", "status", "--active", "--hostname", "github.com"]
stdout = """github.com
  ✓ Logged in to github.com account octocat (keyring)
  - Active account: true
  - Git operations protocol: https
  - Token scopes: 'gist', 'project', 'read:org', 'repo', 'workflow'
"""

[[call]]
argv = ["repo", "view", "--json", "nameWithOwner"]
stdout = '{"nameWithOwner":"o/r"}'

[[call]]
argv = ["repo", "view", "o/r", "--json", "defaultBranchRef"]
stdout = '{"defaultBranchRef":{"name":"main"}}'

[[call]]
argv = ["repo", "view", "o/r", "--json", "visibility"]
stdout = '{"visibility":"PUBLIC"}'

[[call]]
argv = ["api", "-H", "Accept: application/vnd.github.raw", "repos/o/r/contents/*"]
stderr = "gh: Not Found (HTTP 404)"
exit = 1

[[call]]
argv = ["api", "repos/o/r/contents/*"]
stderr = "gh: Not Found (HTTP 404)"
exit = 1

[[call]]
argv = ["api", "repos/o/r/branches/main", "--jq", ".commit.sha"]
stdout = "3f2a9c1d5e7b4a60918c2d3e4f5a6b7c8d9e0f1a\n"

[[call]]
argv = ["api", "user", "--jq", ".login"]
stdout = "octocat\n"

[[call]]
argv = ["issue", "list", "--repo", "o/r", "--state", "open", "--limit", "1000", "--json", "number,title,body,author"]
stdout = '[{"number":12,"title":"CHORE: bootstrap the project","body":"Tracks the one-time bootstrap of this repository: project context, constitution, roadmap, GitHub settings and the bootstrap pull request.","author":{"login":"octocat"}}]'

[[call]]
argv = ["api", "--paginate", "repos/o/r/branches", "--jq", ".[].name"]
stdout = "12-chore-bootstrap\nmain\n"

[[call]]
argv = ["pr", "list", "--repo", "o/r", "--state", "all", "--limit", "200", "--json", "number,title,state,headRefName,headRefOid,isCrossRepository"]
stdout = "[]"

[[call]]
argv = ["secret", "list", "--repo", "o/r", "--json", "name"]
stdout = "[]"

[[call]]
argv = ["api", "repos/o/r/actions/organization-secrets?per_page=100"]
stdout = '{"total_count":0,"secrets":[]}'

[[call]]
argv = ["pr", "list", "--repo", "o/r", "--head", "12-chore-bootstrap", "--state", "open", "--json", "headRefOid"]
stdout = "[]"

[[call]]
argv = ["api", "repos/o/r/branches/12-chore-bootstrap", "--jq", ".commit.sha"]
stdout = "7b1d4e8a2c6f9035ad41e8b7c0f2d3a45e6b7c89\n"

[[call]]
argv = ["label", "list", "--repo", "o/r", "--limit", "500", "--json", "name,color,description"]
stdout = "[]"

[[call]]
argv = ["api", "graphql", "--input", "*"]
query = "repositories\\(first"
stdout = '''{"data":{"repositoryOwner":{"__typename":"Organization","projectV2":{"id":"PVT_kwDOAexample","url":"https://github.com/orgs/o/projects/7","repositories":{"nodes":[]},"fields":{"nodes":[{"id":"PVTF_title","name":"Title","dataType":"TITLE"},{"id":"PVTSSF_status","name":"Status","dataType":"SINGLE_SELECT","options":[{"id":"a1b2c3d4","name":"Todo","color":"GREEN","description":"This item hasn't been started"},{"id":"e5f6a7b8","name":"In Progress","color":"YELLOW","description":"This is actively being worked on"},{"id":"c9d0e1f2","name":"Done","color":"PURPLE","description":"This has been completed"}]}]}}}}}'''

[[call]]
argv = ["api", "graphql", "--input", "*"]
query = "workflows\\(first"
stdout = '''{"data":{"repositoryOwner":{"projectV2":{"workflows":{"nodes":[{"name":"Pull request linked to issue","enabled":false},{"name":"Auto-add sub-issues to project","enabled":false}]}}}}}'''

[[call]]
argv = ["api", "repos/o/r/rulesets?includes_parents=false&per_page=100"]
stdout = "[]"

[[call]]
argv = ["api", "repos/o/r", "--jq", ".private"]
stdout = "false\n"

[[call]]
argv = ["api", "repos/o/r/actions/permissions/fork-pr-contributor-approval"]
stdout = '{"approval_policy":"first_time_contributors"}'

[[call]]
argv = ["variable", "list", "--repo", "o/r", "--json", "name"]
stdout = "[]"
