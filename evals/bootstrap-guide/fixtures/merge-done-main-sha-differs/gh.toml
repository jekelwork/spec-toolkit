[[call]]
argv = ["api", "repos/o/r", "--jq", ".private"]
stdout = "false\n"

[[call]]
argv = ["api", "repos/o/r/actions/permissions/fork-pr-contributor-approval"]
stdout = '{"approval_policy":"all_external_contributors"}'

[[call]]
argv = ["secret", "list", "--repo", "o/r", "--json", "name"]
stdout = '[{"name":"PROJECT_BOARD_TOKEN"}]'

# The jq filter holds `[` and `]`, which the shim reads as a glob, so it is matched by `*`.
[[call]]
argv = ["api", "--paginate", "repos/o/r/issues?state=all&per_page=100", "--jq", "*"]
stdout = ""

[[call]]
argv = ["api", "repos/o/r/actions/organization-secrets?per_page=100"]
