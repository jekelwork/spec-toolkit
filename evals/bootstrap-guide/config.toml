# Settings of the bootstrap-guide evaluation (research D1, contracts/eval-cli.md).
# Repository-only: this directory is never exported.

# Pinned model the agent under test runs on.
model = "claude-opus-5-5"

# Per-run budget cap in USD, passed to the agent.
max_budget_usd = 2.0

# Per-run timeout (10 minutes).
timeout_seconds = 600

# Defaults: parallel runs and launcher (the Phase 1 spike found devvm not installed). Runs per
# scenario default to 5 in the scenario itself (data-model.md), not here.
jobs = 4
launcher = "local"
